# 1.20.4（NeoForge 20.4）用的模组元数据。
# 与 src/main/templates/META-INF/neoforge.mods.toml 的差别：
#   - 文件名是 mods.toml（neoforge.mods.toml 是 20.5+ 才有的）
#   - loaderVersion 是 1.x（NeoForge 20.4 的 javafml 版本号）
#   - 没有 [[mixins]] 段（20.5+ 才有），mixin 配置由 jar 清单的 MixinConfigs 登记
#   - 没有机械动力依赖：Create 没有 1.20.4 版本，本节点的联动代码已排除
#   - Jade 用 13.x
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

authors="${mod_authors}" #optional

description='''${mod_description}'''

# The [[accessTransformers]] block allows you to declare where your AT file is.
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="${neo_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 本模组是农夫乐事的附属，必须同时安装
[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="required"
    versionRange="${farmersdelight_version_range}"
    ordering="AFTER"
    side="BOTH"

# 玉（Jade）：可选，只在客户端显示大缸信息
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[13,)"
    ordering="AFTER"
    side="CLIENT"

# JEI：可选，只在客户端把大缸的配方做成 JEI 分类展示
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="${jei_version_range}"
    ordering="AFTER"
    side="CLIENT"
