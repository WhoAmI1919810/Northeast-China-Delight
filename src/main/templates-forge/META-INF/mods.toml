# 1.20.1（Forge 47.1）用的模组元数据。
# 与 src/main/templates-legacy/META-INF/mods.toml（1.20.4 NeoForge）的差别：
#   - 依赖写在 forge 上（不是 neoforge），版本范围是 47.x
#   - 必需/可选用 mandatory = true/false 表示（type = "..." 是 NeoForge 20.5+ 的写法）
#   - 机械动力回来了（1.20.1 有 Create；1.20.4 没有）
#   - mixin 由 jar 清单的 MixinConfigs 登记，refmap 名字由 build.gradle 写进 mixins.json
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

authors="${mod_authors}" #optional

description='''${mod_description}'''

[[dependencies.${mod_id}]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 本模组是农夫乐事的附属，必须同时安装
[[dependencies.${mod_id}]]
    modId="farmersdelight"
    mandatory=true
    versionRange="${farmersdelight_version_range}"
    ordering="AFTER"
    side="BOTH"

# 机械动力：本模组把它作为前置（大缸成品经流体管道进出储罐）
[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="${create_version_range}"
    ordering="AFTER"
    side="BOTH"

# 玉（Jade）：可选，只在客户端显示大缸信息
[[dependencies.${mod_id}]]
    modId="jade"
    mandatory=false
    versionRange="${jade_version_range}"
    ordering="AFTER"
    side="CLIENT"

# JEI：可选，只在客户端把大缸的配方做成 JEI 分类展示
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="${jei_version_range}"
    ordering="AFTER"
    side="CLIENT"
