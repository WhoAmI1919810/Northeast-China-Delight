# Gradle 自身配置（各版本共用）
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 已知悉并接受 Stonecutter 关于使用 Groovy DSL 的提示
dev.kikugie.stonecutter.hard_mode=true

## 模组信息（各版本共用）

# 模组 ID，必须与主类 @Mod 注解中的字符串一致
mod_id=northeast_china_delight
# 展示名称（英文正式名；中文名「东北乐事」写在 assets/northeast_china_delight/lang/zh_cn.json 里）
mod_name=Northeast China Delight
# 许可证
mod_license=MIT
# 模组版本
mod_version=2.8.6
# 包名 / groupId
mod_group_id=com.gunmu.northeast_china_delight
# 作者
mod_authors=GunMu
# 描述（中英双语，会填进 META-INF/neoforge.mods.toml）
mod_description=Northeast China Delight is an add-on for Farmer's Delight that brings the taste of the black soil to Minecraft: grow 14 Northeast China crops such as napa cabbage, soybeans and sweet potatoes, then turn them into hearty classics like Guo Bao Rou, Sha Zhu Cai and chicken-and-mushroom stew in the cooking pot, on the grill rack or in the fermentation vat - with soy sauce, soybean paste, vinegar and fish sauce brewed in the vat and piped straight into Create. Later updates will carry the flavour into villages, with a provision merchant, crate and sack storage, and Northeast-style village structures.\n\u300c\u4e1c\u5317\u4e50\u4e8b\u300d\u662f\u519c\u592b\u4e50\u4e8b\u7684\u9644\u5c5e\u6a21\u7ec4\uff0c\u628a\u9ed1\u571f\u5730\u4e0a\u7684\u5473\u9053\u642c\u8fdb\u65b9\u5757\u4e16\u754c\uff1a\u79cd\u4e0b\u5927\u767d\u83dc\u3001\u5927\u8c46\u3001\u5730\u74dc\u7b49 14 \u79cd\u4e1c\u5317\u4f5c\u7269\uff0c\u7528\u53a8\u9505\u3001\u70e7\u70e4\u67b6\u548c\u5927\u7f38\u505a\u51fa\u9505\u5305\u8089\u3001\u6740\u732a\u83dc\u3001\u5c0f\u9e21\u7096\u8611\u83c7\u8fd9\u4e9b\u5730\u9053\u4e1c\u5317\u83dc\uff0c\u8fd8\u80fd\u628a\u9171\u6cb9\u3001\u5927\u9171\u3001\u918b\u3001\u9c7c\u9732\u7684\u917f\u9020\u63a5\u5230\u673a\u68b0\u52a8\u529b\u7684\u6d41\u4f53\u7ba1\u9053\u4e0a\u81ea\u52a8\u5316\u751f\u4ea7\u3002\u540e\u7eed\u7248\u672c\u4f1a\u628a\u8fd9\u4efd\u5473\u9053\u94fa\u5230\u6751\u5e84\u91cc \u2014\u2014 \u526f\u98df\u5546\u6751\u6c11\u3001\u7bb1\u88c5\u888b\u88c5\u6536\u7eb3\u4e0e\u4e1c\u5317\u98ce\u60c5\u6751\u5e84\u6b63\u5728\u8def\u4e0a\u3002

