# Gradle 自身配置（各版本共用）
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 已知悉并接受 Stonecutter 关于使用 Groovy DSL 的提示
dev.kikugie.stonecutter.hard_mode=true

## 模组信息（各版本共用）

# 模组 ID，必须与主类 @Mod 注解中的字符串一致
mod_id=dongbei_delight
# 展示名称
mod_name=Dongbei Delight
# 许可证
mod_license=All Rights Reserved
# 模组版本
mod_version=0.0.1
# 包名 / groupId
mod_group_id=com.gunmu.dongbei_delight
# 作者
mod_authors=GunMu
# 描述
mod_description=Big Dongbei is my hometown.

# 游戏版本相关参数（minecraft_version、neo_version、parchment_* 等）
# 已拆分到 versions/<游戏版本>/gradle.properties，由 Stonecutter 按节点加载。
