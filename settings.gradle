pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.kikugie.dev/snapshots' }
    }
}

plugins {
    // foojay 用来给 toolchain 自动下载 JDK；1.20.4 节点在 Gradle 9.2 上会触发
    // JvmVendorSpec IBM_SEMERU 崩溃，暂时禁用，改用本机已有的 JDK21
    // id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(getRootProject()) {
        versions '1.20.1', '1.21.1'
        vcsVersion = '1.21.1'
    }
}

rootProject.name = 'northeast_china_delight'
