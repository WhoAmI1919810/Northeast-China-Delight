pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.kikugie.dev/snapshots' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    // 本工程使用 Groovy DSL
    kotlinController = false
    centralScript = 'build.gradle'

    create(getRootProject()) {
        // 每个条目会在 versions/<名字>/ 下生成一个 Gradle 子项目
        // 本模组是农夫乐事的附属，目标版本必须跟随农夫乐事：
        // https://modrinth.com/mod/farmers-delight 目前只发布到 1.21.1，
        // 待其发布新版本线后在这里追加对应节点即可。
        versions '1.21.1'
        // 提交进仓库的源码状态以该版本为准
        vcsVersion = '1.21.1'
    }
}

rootProject.name = 'dongbei_delight'
