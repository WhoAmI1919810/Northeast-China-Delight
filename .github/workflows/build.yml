name: Build

on: [push, pull_request, workflow_dispatch]

# 只需要只读权限
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Gradle 启动器与 1.21.1 节点需要 JDK 21；
      # GitHub 的 ubuntu runner 自带 JDK 17（1.20.x 节点工具链），Gradle 自动探测即可
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        # 该分支只负责 1.21.1；1.20.1 由独立分支构建，避免两个节点争用共享 libs 输出。
        # Stonecutter 0.9.8 在 Gradle 9.2 上的配置缓存兼容性不稳，显式关闭。
        run: ./gradlew :1.21.1:build --no-configuration-cache
