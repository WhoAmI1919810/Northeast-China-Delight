# 该节点（Minecraft 1.20.1，Forge 47.1，API 在 net.minecraftforge.* 下）使用的版本参数。
# 注意：1.20.1 的「NeoForge」构建和 Forge 是同一套包名（net.minecraftforge.*），
# 本节点按 Forge 47.1 构建（Create 1.20.1 用的就是 47.1.33）。
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)

# Forge 47.1
forge_version=47.1.33
# 1.20.1 的 47.x 全线（47.1.33 ~ 47.4.26）都支持：编译仍用最低的 47.1.33，声明放宽到整个 47 大版本
forge_version_range=[47.1.0,48)
# javafml 的 loader 版本（Forge 1.20.1 是 47.x）
loader_version_range=[47,)

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# 农夫乐事（本模组是其附属）：1.20.1 有官方发布，直接用 Modrinth 上的 1.3.4
farmersdelight_version=1.20.1-1.3.4
farmersdelight_version_range=[1.3,)

# 机械动力：1.20.1 有官方 6.0.8（1.20.2~1.20.6 全都没有，这正是本节点存在的意义）
create_version=mc1.20.1-6.0.8
create_version_range=[6.0.0,7.0)
# Create 6.0.8 在 jar 里内嵌（jarjar）的依赖，编译期需要它们来解析 Create 的 API 签名
ponder_version=1.0.91
flywheel_version=1.0.6-beta-266
registrate_version=MC1.20-1.3.3

# 玉（Jade）：1.20.1 对应 11.x
jade_version=11.13.3+forge
jade_version_range=[11,)

# JEI：1.20.1 对应 15.x。
# 编译期必须对齐玩家实际在用的 15.20.0.106：更新的 JEI（15.62 一带）给 IRecipeSlotBuilder
# 加了协变返回的 addFluidStack(Fluid,long)，按新版编译出的描述符是
#   IRecipeSlotBuilder.addFluidStack(Fluid,long)LIRecipeSlotBuilder;
# 这个描述符在 15.20 里不存在（只有 IIngredientAcceptor 的擦除签名），游戏里直接
#   NoSuchMethodError -> Found a broken recipe（2026-10-09 玩家客户端实测）。
# 按 15.20 编译时 javac 发出的是 IIngredientAcceptor 的擦除签名，
# 15.20 与更新版本（15.62 的 IIngredientAcceptor 仍在）都能解析。
jei_version=15.20.0.106
jei_version_range=[15.20,)

# MixinExtras：炖锅那两处注入从 @Redirect 换成 @WrapOperation 后依赖的库。
# Forge 47.x 不自带（1.21.1 的 NeoForge 自带 0.5.3），这里用 0.4.1：
# 它对 Mixin 0.8.4~0.8.6 有配套实现，正好覆盖 Forge 47.x 的 Mixin 0.8.5
mixinextras_version=0.4.1
