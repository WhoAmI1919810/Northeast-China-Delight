plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

// 本脚本会被 Stonecutter 对每个 Minecraft 版本各执行一次
// sc.current.version 即当前节点对应的游戏版本，例如 1.21.1
version = "${mod_version}+${sc.current.version}"
group = mod_group_id

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        // 农夫乐事未发布到公共 Maven，通过 Modrinth 的 Maven 代理获取
        maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        // JEI 的官方 Maven：Modrinth 的 maven 只会给到 Fabric 版的 jar（中间名映射，编译不过）
        maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    }
}

base {
    archivesName = mod_id
}

// 1.20.5 起 Mojang 使用 Java 21，本模组支持的各版本均为 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge 版本来自 versions/<游戏版本>/gradle.properties
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file("${rootDir}/src/generated/resources/").getAbsolutePath(),
                    '--existing', file("${rootDir}/src/main/resources/").getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            // 各游戏版本使用独立的运行目录，避免存档与配置互相污染
            gameDirectory = file("${rootDir}/run/${sc.current.version}")
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 农夫乐事：编译期引用其 API，开发运行时实际加载
    compileOnly "maven.modrinth:farmers-delight:${farmersdelight_version}"
    localRuntime "maven.modrinth:farmers-delight:${farmersdelight_version}"

    // 机械动力：本模组的联动前置（流体管道 / 储罐），开发运行时一并加载
    compileOnly "maven.modrinth:create:${create_version}"
    localRuntime "maven.modrinth:create:${create_version}"

    // 玉（Jade）：大缸信息显示，可选依赖，仅客户端
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // 果园乐事：可选联动，只在开发环境里加载方便测试（配方用 neoforge:mod_loaded 门控）
    localRuntime "maven.modrinth:fruits-delight:${fruitsdelight_version}"

    // JEI：可选联动，用于展示大缸的多步骤配方（开发环境里直接装上方便测试）
    // 注意用 JEI 官方 Maven 的构件：-api 里只有 NeoForge 附加部分，公共 API 由它依赖的 common-api 带进来
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // Create 的 catnip GUI 渲染库（在 Ponder jar 里，Create 用 jarjar 内嵌）
    // 编译期必须显式依赖才能拿到 net.createmod.catnip.* 的类
    compileOnly files(
        "${rootDir}/libs/ponder-neoforge-1.0.82+mc1.21.1.jar",
        "${rootDir}/libs/flywheel-neoforge-1.21.1-1.0.6.jar",
        "${rootDir}/libs/Registrate-MC1.21-1.3.0+67.jar")

    // 需要联动其它模组时在此声明，例如：
    // compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// 包含数据生成器产出的资源
sourceSets.main.resources.srcDir "${rootDir}/src/generated/resources"

// 将 src/main/templates 中的占位符替换为各版本的实际参数
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            farmersdelight_version_range: farmersdelight_version_range,
            create_version_range   : create_version_range,
            jei_version_range      : jei_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "${rootDir}/src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${file("${rootDir}/repo")}"
        }
    }
}

// 构建完成后，把 jar 也复制到工程根目录的 lib/ 和 libs/：
// 这两个文件夹是「拿去测试 / 分享」的落脚点，省得每次都翻 versions/<版本>/build/libs。
// 每个游戏版本各留一份，文件名带版本号（northeast_china_delight-<mod_version>+<mc_version>.jar）。
['lib', 'libs'].each { folder ->
    def copyJar = tasks.register("copyJarTo${folder.capitalize()}", Copy) {
        dependsOn tasks.named('jar')
        from tasks.named('jar').flatMap { it.archiveFile }
        into rootProject.file(folder)
    }
    tasks.named('build') { finalizedBy copyJar }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
