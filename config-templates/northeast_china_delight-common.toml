#世界生成
[worldgen]
	#东北小院里的小建筑（灶棚、鸡架、水井、菜窖、柴垛等）是否生成。
	#设为 false 时只生成院子主体，不生成零件。
	yard_parts_enabled = false
	#野生木耳在任意群系橡木上的生成概率，取值 0~1；0 表示不生成。
	#只影响新生成区块；已生成区块不会回溯。
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	wild_wood_ear_oak_chance = 0.05
	#野生木耳在黑森林深色橡木、白桦林 / 原始桦木林白桦上的生成概率，取值 0~1；0 表示不生成。
	#只影响新生成区块；已生成区块不会回溯。
	# Default: 0.07
	# Range: 0.0 ~ 1.0
	wild_wood_ear_forest_chance = 0.07
	#允许在新生成的村庄农田中，把一部分原版作物替换为本模组作物。
	#设为 false 时不替换，不影响原版及其他模组的规则。
	village_farm_crops_enabled = true
	#村庄农田允许生成的作物，填写播种物品的完整注册 ID。
	#默认包含全部 16 种农田作物，空列表表示不生成任何本模组农田作物。
	village_farm_allowed_crops = ["northeast_china_delight:soybean", "northeast_china_delight:corn_seeds", "northeast_china_delight:napa_cabbage_seeds", "northeast_china_delight:snow_mustard_seeds", "northeast_china_delight:cucumber_seeds", "northeast_china_delight:green_onion_seeds", "northeast_china_delight:green_radish_seeds", "northeast_china_delight:eggplant_seeds", "northeast_china_delight:green_beans_seeds", "northeast_china_delight:buckwheat", "northeast_china_delight:red_bean", "northeast_china_delight:peanut", "northeast_china_delight:sweet_potato", "northeast_china_delight:green_pepper_seeds", "northeast_china_delight:red_chili_seeds", "northeast_china_delight:bellflower_seeds"]

